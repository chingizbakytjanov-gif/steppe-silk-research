name: Notify search engines (IndexNow)

# After a change to the pages reaches main, wait for Vercel to deploy it and
# tell Bing, Yandex and the other IndexNow search engines to fetch the pages again.
on:
  push:
    branches: [main]
    paths: ["**.html", "sitemap.xml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the Vercel deploy
        run: sleep 150
      - name: Submit the sitemap URLs
        run: python3 tools/indexnow.py
